<!doctype html>
<html lang="es">
<head>

<title>Muelle 03</title>

<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ice:#dbeeff;--sodium:#ffb454;--alarm:#ff4133;--teal:#57e0d0;--asphalt:#06080b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--asphalt);overflow:hidden;color:var(--ice);
  font-family:'Saira Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  padding:max(14px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
body.play #hud{opacity:1}
.corner{position:absolute;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#obj{top:inherit;left:inherit;font-size:17px;font-weight:600;letter-spacing:.04em;line-height:1.25}
#obj{top:max(14px,env(safe-area-inset-top,0px));left:max(20px,env(safe-area-inset-left,0px))}
#obj small{display:block;font-weight:400;font-size:15px;color:var(--sodium)}
#vit{left:max(20px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(240px,38vw)}
#vit .n{font-size:40px;font-weight:800;line-height:.9}
#vit .n span{font-size:15px;font-weight:400;margin-left:6px;opacity:.75}
#bar{height:5px;margin-top:7px;background:rgba(219,238,255,.16);transform:skewX(-18deg)}
#bar i{display:block;height:100%;width:100%;background:var(--ice);transition:width .15s,background .3s}
#ammo{right:max(20px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));text-align:right}
#ammo .n{font-size:58px;font-weight:800;line-height:.85}
#ammo .n.low{color:var(--alarm)}
#ammo .s{font-size:16px;opacity:.8;margin-bottom:4px}
#msg{position:absolute;left:50%;top:19%;transform:translateX(-50%);text-align:center;font-size:30px;font-weight:800;letter-spacing:.06em;
  opacity:0;transition:opacity .5s;text-shadow:0 2px 14px rgba(0,0,0,.9);white-space:nowrap}
#msg small{display:block;font-size:16px;font-weight:400;color:var(--sodium);letter-spacing:.02em}
#msg.on{opacity:1}
#xh{position:absolute;left:50%;top:50%;--g:6px}
#xh i{position:absolute;background:var(--ice);box-shadow:0 0 2px rgba(0,0,0,.9)}
#xh i:nth-child(1){width:2px;height:9px;left:-1px;top:calc(-9px - var(--g))}
#xh i:nth-child(2){width:2px;height:9px;left:-1px;top:var(--g)}
#xh i:nth-child(3){height:2px;width:9px;top:-1px;left:calc(-9px - var(--g))}
#xh i:nth-child(4){height:2px;width:9px;top:-1px;left:var(--g)}
#xh b{position:absolute;width:2px;height:2px;left:-1px;top:-1px;background:var(--ice)}
#hit{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;transform:rotate(45deg)}
#hit:before,#hit:after{content:"";position:absolute;background:#fff}
#hit:before{left:12px;top:0;width:2px;height:26px;clip-path:polygon(0 0,100% 0,100% 30%,0 30%,0 70%,100% 70%,100% 100%,0 100%)}
#hit:after{top:12px;left:0;height:2px;width:26px;clip-path:polygon(0 0,30% 0,30% 100%,0 100%,0 0,70% 0,100% 0,100% 100%,70% 100%,70% 0)}
#hit.kill:before,#hit.kill:after{background:var(--alarm)}
#dd{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#dd i{position:absolute;left:-46px;top:-150px;width:92px;height:16px;border-top:4px solid var(--alarm);border-radius:50%/100% 100% 0 0;filter:drop-shadow(0 0 6px var(--alarm))}
#rl{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:16px;color:var(--sodium);opacity:0}
/* táctil */
#touch{position:fixed;inset:0;display:none}
body.touch.play #touch{display:block}
#joy{position:absolute;width:120px;height:120px;margin:-60px;border-radius:50%;border:1.5px solid rgba(219,238,255,.28);display:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(219,238,255,.28)}
.tb{position:absolute;border-radius:50%;border:1.5px solid rgba(219,238,255,.4);background:rgba(10,14,20,.35);color:var(--ice);
  display:flex;align-items:center;justify-content:center;font:600 14px 'Saira Condensed',sans-serif}
.tb.on{background:rgba(219,238,255,.3)}
#bF{width:86px;height:86px;right:max(26px,env(safe-area-inset-right,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 84px);border-color:var(--sodium);color:var(--sodium)}
#bJ{width:58px;height:58px;right:calc(max(26px,env(safe-area-inset-right,0px)) + 104px);bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 70px)}
#bW{width:58px;height:58px;right:calc(max(26px,env(safe-area-inset-right,0px)) + 14px);bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 182px)}
#bR{width:58px;height:58px;right:calc(max(26px,env(safe-area-inset-right,0px)) + 88px);bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 160px)}
#bP{width:42px;height:42px;right:max(16px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px))}
#bS{width:42px;height:42px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 54px);top:max(12px,env(safe-area-inset-top,0px));font-size:19px}
/* portada / pausa */
#ov{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;
  padding:max(28px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) max(36px,env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,rgba(4,6,9,.92) 0%,rgba(4,6,9,.55) 38%,rgba(4,6,9,0) 70%);transition:opacity .35s}
body.play #ov{opacity:0;pointer-events:none}
#ov h1{margin:0;font-weight:800;font-size:clamp(64px,17vw,150px);line-height:.82;letter-spacing:-.01em;color:var(--ice)}
#ov h1 span{display:block;font-size:.3em;font-weight:400;letter-spacing:.02em;color:var(--sodium);margin-bottom:.35em}
#ov p{margin:16px 0 0;max-width:46ch;font-size:18px;line-height:1.35;color:rgba(219,238,255,.82)}
#ov p.k{font-size:16px;color:rgba(219,238,255,.6)}
#acts{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:22px}
#fs{pointer-events:auto;cursor:pointer;background:none;border:1.5px solid rgba(219,238,255,.45);color:var(--ice);padding:11px 20px 10px;font:600 18px 'Saira Condensed','Arial Narrow',sans-serif;transform:skewX(-10deg)}
#fs:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
#nw{pointer-events:auto;cursor:pointer;background:none;border:0;color:rgba(219,238,255,.75);padding:11px 4px 10px;font:600 17px 'Saira Condensed','Arial Narrow',sans-serif;text-decoration:underline;text-underline-offset:4px}
#nw:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
#ovC{margin:18px 0 0;font-size:15px;color:rgba(219,238,255,.55)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
#fade.on{opacity:1}
#go{pointer-events:auto;cursor:pointer;border:0;padding:13px 30px 12px;font:800 22px 'Saira Condensed','Arial Narrow',sans-serif;letter-spacing:.03em;
  color:#0b0d10;background:var(--sodium);transform:skewX(-10deg)}
#go:disabled{background:rgba(219,238,255,.25);color:rgba(219,238,255,.7);cursor:default}
#go:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
@media (max-height:480px){#ov h1{font-size:64px}#ov p{font-size:15px;margin-top:8px}#acts{margin-top:12px}}
</style>
</head>

<div id="hud">

<script>
(function(){'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('go').textContent='No se pudo cargar el motor 3D';return}
const T=THREE,V3=T.Vector3;
const QS=new URLSearchParams(location.search);
const isTouch=(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)&&!QS.has('desktop');
const LOW=isTouch||QS.has('low');
if(isTouch)document.body.classList.add('touch');
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,frac=x=>x-Math.floor(x);
const sst=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const lin=(r,g,b,k)=>{k=k===undefined?1:k;return new T.Color(Math.pow(r,2.2)*k,Math.pow(g,2.2)*k,Math.pow(b,2.2)*k)};
function rng(s){return function(){s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(90210),RR=(a,b)=>a+(b-a)*R();

/* ================= renderer ================= */
const canvas=$('c');
const renderer=new T.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance',stencil:false,alpha:false});
renderer.physicallyCorrectLights=true;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const gl2=renderer.capabilities.isWebGL2;
const HDR=gl2?(renderer.extensions.has('EXT_color_buffer_float')||renderer.extensions.has('EXT_color_buffer_half_float')):renderer.extensions.has('EXT_color_buffer_half_float');
const USE_PP=HDR&&!!(T.EffectComposer&&T.RenderPass&&T.ShaderPass&&T.UnrealBloomPass);
if(USE_PP){renderer.outputEncoding=T.LinearEncoding;renderer.toneMapping=T.NoToneMapping}
else{renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15}
const maxDpr=Math.min(window.devicePixelRatio||1,LOW?1.25:1.6);let dpr=maxDpr;
const scene=new T.Scene();
const FOGC=new T.Color(.022,.03,.048);
scene.fog=new T.FogExp2(FOGC.getHex(),.0125);scene.fog.color.copy(FOGC);
const camera=new T.PerspectiveCamera(72,1,.15,520);camera.rotation.order='YXZ';
const timeU={value:0};
const maxAniso=renderer.capabilities.getMaxAnisotropy();

/* ================= ruido y texturas procedurales ================= */
const PERM=new Uint8Array(512),RV=new Float32Array(256);
(function(){const p=[];for(let i=0;i<256;i++){p[i]=i;RV[i]=R()}for(let i=255;i>0;i--){const j=(R()*(i+1))|0,t=p[i];p[i]=p[j];p[j]=t}for(let i=0;i<512;i++)PERM[i]=p[i&255]})();
function vn(x,y,px,py){py=py||px;let xi=Math.floor(x),yi=Math.floor(y);const fx=x-xi,fy=y-yi;
  const x0=((xi%px)+px)%px,x1=(x0+1)%px,y0=((yi%py)+py)%py,y1=(y0+1)%py;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=RV[PERM[PERM[x0]+y0]],b=RV[PERM[PERM[x1]+y0]],c=RV[PERM[PERM[x0]+y1]],d=RV[PERM[PERM[x1]+y1]];
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(u,v,per,oct){let a=0,amp=.5,n=0;for(let i=0;i<oct;i++){a+=amp*vn(u*per,v*per,per);n+=amp;per*=2;amp*=.5}return a/n}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c}
function ctex(c,srgb){const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=Math.min(8,maxAniso);if(srgb)t.encoding=T.sRGBEncoding;return t}
function genPBR(size,fn,k){
  const N=size*size,H=new Float32Array(N),ca=mkCanvas(size),cn=mkCanvas(size),cr=mkCanvas(size);
  const xa=ca.getContext('2d'),xn=cn.getContext('2d'),xr=cr.getContext('2d');
  const ia=xa.createImageData(size,size),inn=xn.createImageData(size,size),ir=xr.createImageData(size,size);
  const A=ia.data,Nn=inn.data,Rr=ir.data,o=[0,0,0,0,0,0];
  for(let y=0,i=0;y<size;y++)for(let x=0;x<size;x++,i++){o[5]=0;fn(x/size,y/size,o);const j=i*4;
    A[j]=o[0]*255;A[j+1]=o[1]*255;A[j+2]=o[2]*255;A[j+3]=255;H[i]=o[3];Rr[j]=255;Rr[j+1]=o[4]*255;Rr[j+2]=o[5]*255;Rr[j+3]=255}
  const s=size*k;
  for(let y=0,i=0;y<size;y++){const yu=((y+size-1)%size)*size,yd=((y+1)%size)*size,yy=y*size;
    for(let x=0;x<size;x++,i++){const xl=(x+size-1)%size,xr2=(x+1)%size;
      const dx=(H[yy+xr2]-H[yy+xl])*s,dy=(H[yd+x]-H[yu+x])*s,l=1/Math.sqrt(dx*dx+dy*dy+1),j=i*4;
      Nn[j]=(-dx*l*.5+.5)*255;Nn[j+1]=(dy*l*.5+.5)*255;Nn[j+2]=(l*.5+.5)*255;Nn[j+3]=255}}
  xa.putImageData(ia,0,0);xn.putImageData(inn,0,0);xr.putImageData(ir,0,0);
  return{map:ctex(ca,true),normalMap:ctex(cn),orm:ctex(cr)}}
function pbrMat(tx,opt,tu,tv){const m=new T.MeshStandardMaterial(Object.assign({map:tx.map,normalMap:tx.normalMap,roughnessMap:tx.orm,metalnessMap:tx.orm,roughness:1,metalness:1},opt||{}));m.userData.tu=tu||2;m.userData.tv=tv||tu||2;return m}

function makeTextures(){
  const FS=LOW?512:1024,TX={};
  TX.floor=genPBR(FS,(u,v,o)=>{
    const g=fbm(u,v,48,3),m=fbm(u+.31,v+.73,4,5),ag=vn(u*170,v*170,170);
    const cd=Math.abs(fbm(u+.52,v+.13,5,4)-.5),cm=sst(.42,.6,fbm(u+.9,v+.4,3,2));
    const crack=cd<.007?(1-cd/.007)*cm:0,sp=ag>.76?(ag-.76)*4.2:0;
    o[3]=.5*g+.3*m+.3*sp-crack*.9;
    let b=.115+.06*m+.04*g+sp*.13-crack*.08;const oil=sst(.62,.76,fbm(u+.2,v+.6,6,3));b*=1-.4*oil;
    o[0]=b;o[1]=b*1.02;o[2]=b*1.07;o[4]=clamp(.46+.3*g-.25*oil-.22*m+crack*.3,.1,1)},.0028);
  TX.conc=genPBR(512,(u,v,o)=>{
    const n1=fbm(u,v,4,6),n2=fbm(u+.5,v+.2,40,3),po=vn(u*120,v*120,120);
    let h=.6+.22*n1+.12*n2-(po>.85?(po-.85)*3:0),dark=0;
    const fu=frac(u*2),fv=frac(v*3),seam=Math.min(Math.min(fu,1-fu)/2,Math.min(fv,1-fv)/3);
    if(seam<.004){h-=.45*(1-seam/.004);dark=.3*(1-seam/.004)}
    const hd=Math.hypot((Math.abs(fu-.5)-.35)/2,(Math.abs(fv-.5)-.3)/3);if(hd<.007){h-=.5;dark=.55}
    const st=sst(.5,.82,vn(u*40,v*2,40,2))*sst(.3,.7,fbm(u+.1,v+.8,6,3));
    let b=(.4+.14*n1+.07*n2)*(1-dark)*(1-.42*st);
    o[0]=b*1.02;o[1]=b;o[2]=b*.95;o[3]=h;o[4]=clamp(.86-.55*st-.12*n2,.18,1)},.006);
  const cont=(col,seed,flat)=>genPBR(flat?256:512,(u,v,o)=>{
    const up=1-v,t=frac(u*4),ridge=flat?.5:(t<.12?t/.12:t<.5?1:t<.62?1-(t-.5)/.12:0),rail=!flat&&(v<.035||v>.965);
    const n=fbm(u+seed,v+seed*.7,6,5),n2=fbm(u+.37+seed,v+.11,40,3);
    const rust=sst(.57,.71,n*.75+n2*.25+(up<.16?(.16-up)*1.1:0)+(rail?.07:0)),drip=sst(.6,.86,vn(u*36+seed*9,v*2,36,2))*sst(.4,.7,n);
    const scratch=(vn(u*14+seed*3,v*220,14,220)>.93&&n2>.52)?1:0;
    o[3]=(rail?1.15:ridge)-rust*.14*n2;
    const sh=.82+.34*n2-.28*drip;let r=col[0]*sh,g=col[1]*sh,b=col[2]*sh;
    r=lerp(r,.32+.12*n2,rust);g=lerp(g,.15+.05*n2,rust);b=lerp(b,.07,rust);
    if(scratch&&rust<.5){r=g=b=.6;o[5]=1}
    o[0]=r;o[1]=g;o[2]=b;o[4]=clamp(lerp(.3+.22*n2,.92,rust)-(scratch?.1:0),.12,1)},flat?.004:.012);
  TX.cBlue=cont([.1,.27,.5],.1);TX.cRed=cont([.52,.13,.09],.47);TX.cOchre=cont([.7,.5,.12],.83);
  TX.pOlive=cont([.22,.27,.17],.2,true);TX.pWhite=cont([.74,.75,.76],.6,true);TX.pBlue=cont([.08,.22,.42],.35,true);
  TX.shutter=genPBR(256,(u,v,o)=>{const t=frac(v*13),sl=t<.8?Math.sin(t/.8*Math.PI):-.4,n=fbm(u,v,8,4),d=sst(.55,.85,vn(u*30,v*2,30,2));
    const b=(.36+.1*n)*(1-.3*d)*(t<.8?1:.5);o[0]=b*.98;o[1]=b;o[2]=b*1.04;o[3]=sl*.6;o[4]=clamp(.42+.3*n,.2,1);o[5]=0},.012);
  TX.metal=genPBR(256,(u,v,o)=>{const br=vn(u*6,v*250,6,250),n=fbm(u,v,8,4),sc=vn(u*200,v*9,200,9)>.95?1:0;
    const b=.3+.08*n+.05*br;o[0]=b;o[1]=b*1.02;o[2]=b*1.06;o[3]=br*.15+n*.4-sc*.3;o[4]=clamp(.28+.28*n+.1*br+sc*.2,.1,1);o[5]=1},.004);
  return TX}

/* ================= materiales, colisiones y utilidades de construcción ================= */
let TX,M={};
const world=new T.Group();scene.add(world);const bg=new T.Group();scene.add(bg);

    d.ph+=(sp*2.6+.0)*dt;d.hitT=Math.max(0,d.hitT-dt);const dr=d.st==='drop'?1:0;
    d.bd.position.y=Math.sin(d.ph*2)*.018*mv+Math.sin(time*2.2+d.ph)*.008-d.hitT*.25;d.bd.rotation.z=Math.sin(d.ph)*.03*mv;d.bd.rotation.x=d.hitT*.5;
    for(const l of d.legs){const a=d.ph+l.o;l.hip.rotation.x=Math.sin(a)*.3*mv;l.hip.rotation.z=l.sx*(Math.max(0,Math.cos(a))*.24*mv+dr*.35)}
    const ch=d.burst>0?1:clamp(1-(d.fireT-time)/.6,0,1),kk=d.hitT>0?14:2.4+ch*ch*13;d.eyeM.color.setRGB(kk,kk*(.1+ch*.1),kk*.05);
    d.flT-=dt;d.fl.visible=d.flT>0}
  snd.hum(alive*1.6);return alive}

/* ================= oleadas y HUD ================= */
const LEVELS=10,MAXA=6;let level=1,phase='waves',waveQ=false,wave=0,toSpawn=0,spawnT=0,betweenT=0,aliveN=0,t0=0,msgT=0;
const waveSize=i=>[3,4,6][i]+level-1;
function saveLevel(){try{localStorage.setItem('muelle03.nivel',String(level))}catch(e){}}
function savedLevel(){try{const v=parseInt(localStorage.getItem('muelle03.nivel'),10);return v>=1&&v<=LEVELS?v:1}catch(e){return 1}}
function banner(a,b,dur){const m=$('msg');m.innerHTML=a+(b?'<small>'+b+'</small>':'');m.classList.add('on');msgT=time+(dur||2.6)}
function startWave(i){wave=i;waveQ=level>=2&&i===1;toSpawn=waveQ?Math.max(2,Math.round(waveSize(i)*.6)):waveSize(i);spawnT=time+2.2;betweenT=0;
  if(i===0)banner('Nivel '+level+': '+Z.name,'Oleada 1 de 3 · '+toSpawn+' hostiles',3.6);else banner('Oleada '+(i+1)+' de 3',toSpawn+(waveQ?' drones cuadrúpedos entrando':' hostiles entrando'));hud.obj()}
function openExit(){phase='exit';betweenT=0;gate.open=true;const k=cols.indexOf(gate.col);if(k>=0)cols.splice(k,1);snd.gate();banner('Zona despejada','Cruza el portón hacia la siguiente zona',6);hud.obj()}
function nextLevel(){if(phase==='load')return;phase='load';$('fade').classList.add('on');
  setTimeout(()=>{level++;saveLevel();loadZone(level-1);resetLevel();clock=performance.now();$('fade').classList.remove('on')},450)}
function updateWaves(){
  if(phase==='waves'){
    if(toSpawn>0&&time>spawnT&&aliveN<(waveQ?4:MAXA)){if(waveQ?spawnQuad():spawnDrone()){toSpawn--;spawnT=time+1.1;hud.obj()}}
    if(toSpawn===0&&aliveN===0&&!betweenT){if(wave===2)betweenT=time+1.2;else{betweenT=time+4.5;banner('Oleada superada','Recarga y busca cobertura',3)}}
    if(betweenT&&time>betweenT){if(wave<2)startWave(wave+1);else if(level>=LEVELS)endGame(true);else openExit()}}
  else if(phase==='exit'&&gate&&P.pos.z>gate.z+1.4&&Math.abs(P.pos.x-gate.x)<gate.w/2+.4)nextLevel();
  if(msgT&&time>msgT){$('msg').classList.remove('on');msgT=0}}
const hud={
  hp(){const v=Math.ceil(P.hp);$('hpN').textContent=v;const b=$('hpB');b.style.width=v+'%';b.style.background=v<35?'var(--alarm)':'var(--ice)'},
  ammo(){const n=$('amN');n.textContent=W.ammo;n.className='n'+(W.ammo<=(W.w?2:8)?' low':'');$('amW').textContent=WNAME[W.w]},
  obj(){$('oS').textContent=phase==='exit'?'Nivel '+level+' despejado · cruza el portón':'Nivel '+level+'/'+LEVELS+' · oleada '+(wave+1)+'/3 · hostiles: '+(foes.filter(d=>d.alive).length+toSpawn)},
  hit(k){const h=$('hit');h.className=k?'kill':'';h.style.transition='none';h.style.opacity=1;h.style.transform='rotate(45deg) scale('+(k?1.5:1)+')';requestAnimationFrame(()=>{h.style.transition='opacity .35s';h.style.opacity=0})},
  xh(){$('xh').style.setProperty('--g',(5+(W.spread+(1-W.ads)*.004)*900+Math.hypot(P.vel.x,P.vel.z)*1.2)+'px')}};
function resetGame(){if(state==='win'){level=1;saveLevel()}if(!Z||Z.lv!==level||(gate&&gate.open))loadZone(level-1);resetLevel()}
function resetLevel(){P.pos.set(Z.start[0],0,Z.start[1]);P.cy=0;P.vel.set(0,0,0);P.yaw=Z.start[2];P.pitch=0;P.hp=100;P.lastHit=-99;P.pp=P.py=0;P.ground=true;
  W.am=[30,8];W.ammo=W.am[W.w];W.reloading=false;W.swT=0;W.pumpT=0;W.shots=W.hits=W.kills=0;W.spread=0;$('rl').style.opacity=0;
  for(const d of foes){d.alive=false;d.st='off';d.g.visible=false}snd.hum(0);for(const b of FX.bolts){b.on=false;b.g.visible=false}
  phase='waves';t0=time;drawAmmo();hud.hp();hud.ammo();startWave(0)}
function overlay(kind,extra){const tt=$('ovT'),p=$('ovP'),k=$('ovK'),go=$('go');go.disabled=false;
  const ctl=isTouch?'Pulgar izquierdo para moverte, derecho para mirar. Mejor en horizontal.':'WASD para moverte, ratón para apuntar, clic para disparar, clic derecho para la mira, R recarga, Q cambia de arma, Espacio salta, Mayús corre, F pantalla completa.';
  $('nw').hidden=!(kind==='menu'&&level>1);$('ovC').hidden=kind!=='menu';
  if(kind==='menu'){k.textContent=ctl;go.textContent=level>1?'Continuar en el nivel '+level:'Entrar al muelle'}
  else if(kind==='pause'){tt.innerHTML='<span>Muelle 03</span>En pausa';p.textContent='El equipo de asalto espera. La lluvia no.';k.textContent=ctl;go.textContent='Seguir'}
  else if(kind==='dead'){tt.innerHTML='<span>Nivel '+level+' · oleada '+(wave+1)+' de 3</span>Derribado';p.textContent=extra;k.textContent='';go.textContent='Reintentar el nivel '+level}
  else{tt.innerHTML='<span>Diez niveles superados</span>Puerto despejado';p.textContent=extra;k.textContent='';go.textContent='Jugar otra vez desde el nivel 1'}}
function stats(){const acc=W.shots?Math.round(W.hits/W.shots*100):0,s=Math.round(time-t0);return W.kills+' hostiles abatidos, '+acc+' % de precisión, '+Math.floor(s/60)+' min '+(s%60)+' s.'}
function endGame(win){state=win?'win':'dead';document.body.classList.remove('play');overlay(state,stats());fireHeld=false;snd.hum(0);if(document.pointerLockElement)document.exitPointerLock()}
function setPlay(){state='play';document.body.classList.add('play');clock=performance.now()}
function pause(){if(state!=='play')return;state='pause';document.body.classList.remove('play');overlay('pause');fireHeld=false;adsHeld=false;snd.suspend()}

$('nw').addEventListener('click',()=>{if(state!=='menu')return;level=1;saveLevel();$('go').click()});
$('go').addEventListener('click',()=>{if(state==='load')return;snd.init();
  if(state==='menu'||state==='dead'||state==='win')resetGame();
  if(isTouch||noPL){setPlay();return}
  try{const pr=canvas.requestPointerLock();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
  setTimeout(()=>{if(state!=='play'&&!document.pointerLockElement){if(!everLocked){noPL=true;banner('Arrastra con el ratón para mirar','El navegador bloqueó la captura del cursor',4)}if(noPL)setPlay()}},450)});
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement===canvas){everLocked=true;if(state!=='play')setPlay()}else if(!noPL)pause()});
document.addEventListener('pointerlockerror',()=>{if(!everLocked)noPL=true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();if(document.pointerLockElement)document.exitPointerLock()}});
/* pantalla completa */
const fsRoot=document.documentElement,fsOK=!!(fsRoot.requestFullscreen||fsRoot.webkitRequestFullscreen)&&(document.fullscreenEnabled!==false);
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFs(){if(!fsOK)return;try{if(fsOn()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const pr=(fsRoot.requestFullscreen||fsRoot.webkitRequestFullscreen).call(fsRoot,{navigationUI:'hide'});if(pr&&pr.catch)pr.catch(()=>{})}}catch(e){}}
function fsSync(){$('fs').textContent=fsOn()?'Salir de pantalla completa':'Pantalla completa';$('bS').classList.toggle('on',fsOn())}
if(fsOK){$('fs').hidden=false;$('fs').addEventListener('click',toggleFs);document.addEventListener('fullscreenchange',fsSync);document.addEventListener('webkitfullscreenchange',fsSync)}else $('bS').style.display='none';
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=true;if(e.code==='KeyF')toggleFs();if(e.code==='Space'){jumpQ=true;e.preventDefault()}
  if((e.code==='Escape'||e.code==='KeyP')&&noPL&&state==='play')pause();if(e.code==='Tab')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;fireHeld=adsHeld=false});
canvas.addEventListener('mousedown',e=>{if(state!=='play')return;if(e.button===0)fireHeld=true;if(e.button===2)adsHeld=true;e.preventDefault()});
addEventListener('mouseup',e=>{if(e.button===0)fireHeld=false;if(e.button===2)adsHeld=false});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{if(state==='play'&&Math.abs(e.deltaY)>20)switchWeapon()},{passive:true});
addEventListener('mousemove',e=>{if(state!=='play')return;if(document.pointerLockElement===canvas||(noPL&&(e.buttons&3))){const k=.0022*lerp(1,.6,W.ads);lookDX+=clamp(e.movementX||0,-120,120)*k;lookDY+=clamp(e.movementY||0,-120,120)*k}});
// táctil
(function(){const tz=$('touch'),jb=$('joy'),js=jb.firstElementChild,bF=$('bF');let fireId=null;
  tz.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){const el=t.target;
    if(el.id==='bJ'){jumpQ=true;continue}if(el.id==='bR'){startReload();continue}if(el.id==='bW'){switchWeapon();continue}if(el.id==='bP'){pause();continue}if(el.id==='bS')continue;
    if(el.id==='bF'){fireId=t.identifier;fireHeld=true;bF.classList.add('on');if(look.id===null){look.id=t.identifier;look.x=t.clientX;look.y=t.clientY}continue}
    if(t.clientX<innerWidth*.42&&joy.id===null){joy.id=t.identifier;joy.ox=t.clientX;joy.oy=t.clientY;jb.style.display='block';jb.style.left=t.clientX+'px';jb.style.top=t.clientY+'px';js.style.transform=''}
    else if(look.id===null){look.id=t.identifier;look.x=t.clientX;look.y=t.clientY}}},{passive:false});
  tz.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){
    if(t.identifier===joy.id){let dx=(t.clientX-joy.ox)/52,dy=(t.clientY-joy.oy)/52;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=dy;js.style.transform='translate('+dx*38+'px,'+dy*38+'px)'}
    else if(t.identifier===look.id){lookDX+=(t.clientX-look.x)*.0052;lookDY+=(t.clientY-look.y)*.0044;look.x=t.clientX;look.y=t.clientY}}},{passive:false});
  const end=e=>{e.preventDefault();for(const t of e.changedTouches){if(t.target.id==='bS'&&e.type==='touchend')toggleFs();if(t.identifier===joy.id){joy.id=null;joy.x=joy.y=0;jb.style.display='none'}if(t.identifier===look.id)look.id=null;if(t.identifier===fireId){fireId=null;fireHeld=false;bF.classList.remove('on')}}};
  tz.addEventListener('touchend',end,{passive:false});tz.addEventListener('touchcancel',end,{passive:false})})();

/* ================= posprocesado ================= */
let composer=null,bloom=null,finalPass=null;
function buildPost(){
  if(!USE_PP)return;
  const rt=new T.WebGLRenderTarget(8,8,{type:T.HalfFloatType,format:T.RGBAFormat,minFilter:T.LinearFilter,magFilter:T.LinearFilter,depthBuffer:true,stencilBuffer:true});
  composer=new T.EffectComposer(renderer,rt);composer.addPass(new T.RenderPass(scene,camera));
  composer.addPass({enabled:true,needsSwap:false,clear:false,renderToScreen:false,setSize(){},render(r,wb,rb){r.setRenderTarget(rb);const ac=r.autoClear;r.autoClear=false;r.clearDepth();r.render(wScene,wCam);r.autoClear=ac}});
  bloom=new T.UnrealBloomPass(new T.Vector2(256,256),.5,.6,1.35);composer.addPass(bloom);
  finalPass=new T.ShaderPass({uniforms:{tDiffuse:{value:null},uRes:{value:new T.Vector2(1,1)},uTime:{value:0},uExp:{value:.95},uDmg:{value:0},uLow:{value:0}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:(LOW?'':'#define CA\n')+`uniform sampler2D tDiffuse;uniform vec2 uRes;uniform float uTime,uExp,uDmg,uLow;varying vec2 vUv;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
vec3 tm(vec2 uv){return aces(texture2D(tDiffuse,uv).rgb*uExp);}
float lu(vec3 c){return dot(c,vec3(.299,.587,.114));}
float hh(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
vec3 fxaa(vec2 uv){vec2 px=1./uRes;
 vec3 nw=tm(uv+vec2(-1.,-1.)*px),ne=tm(uv+vec2(1.,-1.)*px),sw=tm(uv+vec2(-1.,1.)*px),se=tm(uv+vec2(1.,1.)*px),m=tm(uv);
 float a=lu(nw),b=lu(ne),c=lu(sw),d=lu(se),e=lu(m),mn=min(e,min(min(a,b),min(c,d))),mx=max(e,max(max(a,b),max(c,d)));
 vec2 dir=vec2(-((a+b)-(c+d)),((a+c)-(b+d)));float rd=max((a+b+c+d)*.03125,.0078125);
 dir=clamp(dir/(min(abs(dir.x),abs(dir.y))+rd),-8.,8.)*px;
 vec3 A=.5*(tm(uv+dir*(1./3.-.5))+tm(uv+dir*(2./3.-.5)));vec3 B=A*.5+.25*(tm(uv-dir*.5)+tm(uv+dir*.5));float lb=lu(B);
 return (lb<mn||lb>mx)?A:B;}
void main(){vec2 c=vUv-.5;float r2=dot(c,c);vec3 col=fxaa(vUv);
#ifdef CA
 float k=smoothstep(.06,.4,r2);col.r=mix(col.r,tm(vUv-c*.0022).r,k);col.b=mix(col.b,tm(vUv+c*.0022).b,k);
#endif
 col=mix(col,vec3(lu(col)),uLow*.55);
 col*=mix(vec3(1.),vec3(.96,1.,1.05),1.-lu(col));
 col*=1.-smoothstep(.12,.78,r2)*.62;
 col=mix(col,vec3(.55,.02,.0),clamp(uDmg,0.,1.)*smoothstep(.04,.42,r2)*.75);
 col=pow(col,vec3(1./2.2));col+=(hh(vUv*uRes+fract(uTime)*91.7)-.5)*.028;
 gl_FragColor=vec4(col,1.);}`});
  composer.addPass(finalPass)}
function resize(){const w=innerWidth,h=innerHeight,as=w/h;renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);
  baseFov=as>=1.2?72:clamp(2*Math.atan(Math.tan(33*Math.PI/180)/as)*180/Math.PI,72,98);camera.aspect=as;camera.fov=baseFov;camera.updateProjectionMatrix();
  wCam.aspect=as;wCam.fov=as>=1.2?50:clamp(2*Math.atan(Math.tan(27*Math.PI/180)/Math.max(as,.62))*180/Math.PI,50,72);wCam.updateProjectionMatrix();
  if(composer){composer.setPixelRatio(dpr);composer.setSize(w,h);finalPass.uniforms.uRes.value.set(w*dpr,h*dpr)}
  if(FX.mat)FX.mat.uniforms.uPx.value=h*dpr*.9}
addEventListener('resize',resize);

/* ================= reflejos del entorno ================= */
function bakeEnv(){
  const rt=new T.WebGLCubeRenderTarget(LOW?128:256,{type:HDR?T.HalfFloatType:T.UnsignedByteType,format:T.RGBAFormat,minFilter:T.LinearFilter,magFilter:T.LinearFilter,generateMipmaps:false,stencilBuffer:true});
  const cc=new T.CubeCamera(.3,520,rt);cc.position.set(Z.env[0],Z.env[1],Z.env[2]);scene.add(cc);const pm=new T.PMREMGenerator(renderer);
  rain.visible=false;L.sky.position.copy(cc.position);const tmS=renderer.toneMapping,enc=renderer.outputEncoding;renderer.toneMapping=T.NoToneMapping;
  for(let i=0;i<2;i++){cc.update(renderer,scene);const env=pm.fromCubemap(rt.texture).texture;if(scene.environment)scene.environment.dispose();scene.environment=env;wScene.environment=env}
  renderer.toneMapping=tmS;renderer.outputEncoding=enc;rain.visible=true;scene.remove(cc);rt.dispose();pm.dispose()}

/* ================= bucle ================= */
let clock=0,fAcc=0,fN=0,fT=0,flashT=RR(9,16),flashV=0,thT=0;
function frame(now){requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-clock)/1000);clock=now;if(!(dt>0))dt=.016;
  const playing=state==='play';
  if(playing||state==='menu'||state==='dead'||state==='win'){time+=dt;timeU.value=time}
  if(playing){updatePlayer(dt);aliveN=updateDrones(dt)+updateQuads(dt);updateBolts(dt);updateWaves();hud.xh()}
  else if(state==='menu'){P.yaw=Z.start[2]+Math.sin(time*.13)*.5;P.pitch=.03+Math.sin(time*.09)*.05}
  if(state!=='pause'){updateFx(dt);placeCamera(playing?dt:.016)}
  lookDX=lookDY=0;
  // luces animadas
  const al=playing&&(aliveN>0||toSpawn>0);
  if(beacon){const a=time*2.6;L.beacon.intensity=lerp(L.beacon.intensity,al?700:0,.08);L.beacon.target.position.set(beacon.x+Math.cos(a)*14,1.5,beacon.z+Math.sin(a)*14);beacon.lm.color.setRGB(al?14:1.5,al?1:.12,al?.6:.08)}else L.beacon.intensity=0;
  if(gate&&gate.open&&gate.t<1){gate.t=Math.min(1,gate.t+dt/2.4);gate.g.position.x=gate.x+gate.w*1.02*sst(0,1,gate.t)}
  for(const l of lamps){if(!l.flick)continue;const n=vn(time*9,3.3,256);l.k=n>.72?.12:(n>.62?.55:1);l.s.intensity=l.base*l.k;l.lm.color.setRGB(16*l.k,9.6*l.k,4.2*l.k);l.vm.uniforms.uC.value.setRGB(.11*l.k,.064*l.k,.029*l.k)}
  flashT-=dt;if(flashT<=0){flashT=RR(16,34);flashV=1;thT=time+RR(.7,1.6)}
  flashV*=Math.exp(-dt*4.5);if(flashV<.002)flashV=0;L.hemi.intensity=.9+flashV*5;skyMat.uniforms.uFl.value=flashV;if(thT&&time>thT){thT=0;snd.thunder()}
  if(L.water)L.water.offset.set(time*.011,time*.019);L.sky.position.copy(camera.position);rainMat.uniforms.uCam.value.copy(camera.position);
  dmgFlash=Math.max(0,dmgFlash-dt*1.6);
  if(composer){const u=finalPass.uniforms;u.uTime.value=time;u.uDmg.value=dmgFlash+(P.hp<35&&playing?.25+.12*Math.sin(time*6):0);u.uLow.value=playing?clamp(1-P.hp/45,0,1):0;composer.render(dt)}
  else{renderer.autoClear=true;renderer.render(scene,camera);renderer.autoClear=false;renderer.clearDepth();renderer.render(wScene,wCam);renderer.autoClear=true}
  // resolución dinámica
  if(playing){fAcc+=dt;fN++;fT+=dt;if(fT>1.6&&time-t0>3){const avg=fAcc/fN;let nd=dpr;if(avg>.03)nd=Math.max(.6,dpr*.82);else if(avg>.024)nd=Math.max(.6,dpr*.92);else if(avg<.0145&&dpr<maxDpr)nd=Math.min(maxDpr,dpr*1.08);
    if(Math.abs(nd-dpr)>.01){dpr=nd;resize()}fAcc=fN=fT=0}}
}

/* ================= arranque ================= */
function boot(){
  try{buildWorld();buildFx();buildGun();buildDrones();buildQuads();loadSoldierModel();loadVehicles();buildPost();resize();
    level=QS.has('nivel')?clamp(parseInt(QS.get('nivel'),10)||1,1,LEVELS):savedLevel();loadZone(level-1);P.pos.set(Z.start[0],0,Z.start[1]);P.yaw=Z.start[2];
    camera.position.set(P.pos.x,1.66,P.pos.z);camera.rotation.set(0,P.yaw,0);camera.updateMatrixWorld();
    renderer.compile(scene,camera);renderer.compile(wScene,wCam);
    hud.hp();hud.ammo();state='menu';overlay('menu');clock=performance.now();requestAnimationFrame(frame);
    window.__game={veh:()=>Object.keys(VEH).length,zone:()=>Z,sw:switchWeapon,keys,die(){hurt(999,P.pos)},lvl:()=>level,phase:()=>phase,gate:()=>gate,quads,spawnQuad,wipe(){for(const d of foes)if(d.alive){d.alive=false;d.st='off';d.g.visible=false}toSpawn=0},sm:()=>!!SM,P,W,drones,state:()=>state,L,start(){resetGame();setPlay()},spawnDrone,renderer}}
  catch(e){console.error(e);$('go').textContent='Error al iniciar: '+e.message}}
requestAnimationFrame(()=>setTimeout(boot,60));
})();
